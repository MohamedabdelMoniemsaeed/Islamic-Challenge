name: Android Maintenance - Safe Updates, Quality Gates and AI Repair

on:
  schedule:
    - cron: "0 7 * * 5" # Friday 09:00 Egypt time (UTC+2) = 07:00 UTC
  workflow_dispatch:
    inputs:
      update_track:
        description: "Select the update track"
        required: true
        type: choice
        default: safe
        options:
          - safe
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-maintenance-${{ github.workflow }}-${{ inputs.update_track || 'safe' }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      HAS_GEMINI: ${{ secrets.AI != '' }}
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js (for AI CLI tools)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Record Environment Versions
        run: |
          java -version
          ./gradlew --version

      - name: Verify Gradle Dependencies Resolution
        id: deps
        continue-on-error: true
        run: |
          ./gradlew dependencies --dry-run || ./gradlew help

      - name: Kotlin and Android Compilation Check
        id: compile_before
        continue-on-error: true
        run: |
          ./gradlew compileDebugKotlin --no-daemon

      - name: Install Gemini CLI
        if: steps.compile_before.outcome == 'failure' && env.HAS_GEMINI == 'true'
        run: npm install --global @google/gemini-cli

      - name: Repair with Gemini
        if: steps.compile_before.outcome == 'failure' && env.HAS_GEMINI == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.AI }}
        run: |
          for i in 1 2 3; do
            echo "Gemini repair attempt $i"

            if ./gradlew compileDebugKotlin --no-daemon; then
              break
            fi

            ./gradlew compileDebugKotlin --no-daemon \
              > "$RUNNER_TEMP/gradle-compile-errors.txt" 2>&1 || true

            export REPAIR_PROMPT="Fix the Android Kotlin Jetpack Compose compilation errors in app/src/. Read the errors in $RUNNER_TEMP/gradle-compile-errors.txt. Preserve existing behavior, Islamic quiz data, and do not change gradle configuration or keystore files. Keep changes minimal."

            gemini --yolo -p "$REPAIR_PROMPT" || true

            if ./gradlew compileDebugKotlin --no-daemon; then
              break
            fi
          done

      - name: Analyze after Gemini
        id: compile_mid
        if: steps.compile_before.outcome == 'failure'
        continue-on-error: true
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Repair with Claude
        if: steps.compile_mid.outcome == 'failure' && env.HAS_CLAUDE == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Fix the remaining Kotlin/Compose build or analysis errors in app/src/.
            Inspect the Gradle compile errors.
            Preserve app behavior and all existing features.
            Do not change gradle configurations, keystore files, or GitHub workflows.
            Make minimal changes.
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./gradlew compileDebugKotlin:*)"

      - name: Final compilation verification
        id: compile_final
        continue-on-error: true
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Run Unit and Robolectric Tests
        id: tests
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Determine Pipeline Quality Gate Status
        id: status
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          COMPILE: ${{ steps.compile_final.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          if [ "$DEPS" = "success" ] &&
             [ "$COMPILE" = "success" ] &&
             [ "$TESTS" = "success" ] &&
             [ "$BUILD" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "note=All required quality gates passed." >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "note=One or more quality gates failed. Manual review required." >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes to default branch
        if: always() && steps.status.outputs.proceed == 'true'
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated maintenance, dependency verification and repair" || true
            git push origin HEAD:${GITHUB_BRANCH}
          fi
