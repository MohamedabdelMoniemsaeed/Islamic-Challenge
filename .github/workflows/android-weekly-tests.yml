name: Android Weekly Tests (Friday 5 AM)

on:
  schedule:
    # Runs every Friday at 05:00 AM Egypt Standard Time (UTC+2) = 03:00 UTC
    - cron: "0 3 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-weekly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Build & Run Unit / Robolectric Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper & debug keystore
        run: |
          chmod +x gradlew
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Compile Android Kotlin sources
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Verify Debug APK assembly
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish test summary
        if: always()
        run: |
          echo "## Friday Automated Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Schedule:** Every Friday at 05:00 AM (UTC+2 / 03:00 UTC)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build & Unit Tests Status:** \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            TOTAL_FILES=$(ls -1 app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | wc -l)
            echo "- **Test Suite XML Reports:** ${TOTAL_FILES} suites executed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
